<title>Blacky's Secret Second Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: a picture book on a desk. One comic page at a time (or all pages stacked), every page scales like a printed page. */
:root{
  --desk:#dfe7e3;        /* the table the book lies on */
  --desk-ink:#24303a;
  --paper:#fffaf0;       /* comic pages stay paper in both themes */
  --ink:#1d1b22;
  --caption:#ffe48a;
  --blanket:#e2a5ad;     /* Blacky's pink blanket */
  --eye:#a9cf3c;         /* Blacky's green eyes */
  --btn:#1d1b22; --btn-ink:#fffaf0;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-letter:"Comic Neue","Comic Sans MS","Chalkboard SE",sans-serif;
  --f-sfx:"Bangers",Impact,"Arial Black",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#151829;--desk-ink:#e8e6f2;--btn:#fffaf0;--btn-ink:#1d1b22;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#151829;--desk-ink:#e8e6f2;--btn:#fffaf0;--btn-ink:#1d1b22;color-scheme:dark}
body{background:var(--desk);color:var(--desk-ink);font-family:var(--f-letter);padding-inline:16px;padding-block:12px 96px}
.top{max-width:760px;margin:0 auto 12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top h2{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:0;letter-spacing:.01em}
.seg{display:flex;border:2px solid var(--desk-ink);border-radius:999px;overflow:hidden}
.seg button{font:700 .85rem var(--f-display);border:0;background:transparent;color:var(--desk-ink);padding:.45em 1em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--desk-ink);color:var(--desk)}
.book{max-width:760px;margin:0 auto;display:grid;gap:28px}
.page{container-type:inline-size;background:var(--paper);color:var(--ink);padding:3.2cqw;border-radius:4px;
  box-shadow:0 1px 0 rgba(0,0,0,.08),0 14px 30px -12px rgba(0,0,0,.35);position:relative;
  --fs:clamp(9.5px,2.35cqw,17px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.8cqw}
.panel{position:relative;margin:0;border:max(2px,.45cqw) solid var(--ink);background:#fff;overflow:hidden;max-width:100%}
.panel.span2{grid-column:span 2}
.panel>svg{display:block;width:100%;height:100%}
.folio{display:flex;justify-content:space-between;align-items:baseline;margin-top:1.6cqw;font:700 calc(var(--fs)*.85) var(--f-display);color:#6c6878}
.ptitle{font:700 calc(var(--fs)*1.35) var(--f-display);margin:0 0 1.4cqw;text-wrap:balance}
/* lettering */
.b{position:absolute;font:700 var(--fs)/1.22 var(--f-letter);color:var(--ink);background:#fff;border:max(1.5px,.32cqw) solid var(--ink);
  border-radius:1.2em;padding:.45em .7em;text-align:center;z-index:2;text-wrap:balance}
.b::after{content:"";position:absolute;width:.95em;height:.95em;background:inherit;border:inherit;border-radius:0;border-top:0;border-left:0}
.b.bl::after{left:18%;bottom:-.55em;transform:rotate(45deg) skew(12deg,12deg)}
.b.br::after{right:18%;bottom:-.55em;transform:rotate(45deg) skew(12deg,12deg)}
.b.bc::after{left:calc(50% - .5em);bottom:-.55em;transform:rotate(45deg)}
.b.tl::after{left:18%;top:-.55em;transform:rotate(225deg) skew(12deg,12deg)}
.b.tr::after{right:18%;top:-.55em;transform:rotate(225deg) skew(12deg,12deg)}
.b.none::after,.b.c::after,.b.x::after{display:none}
.b.t{border-radius:50%/45%;padding:.9em 1em}
.b.t::after{width:.8em;height:.8em;border-radius:50%;border:inherit;left:22%;bottom:-1.1em;transform:none}
.b.t::before{content:"";position:absolute;width:.45em;height:.45em;border-radius:50%;background:#fff;border:inherit;left:14%;bottom:-1.85em}
.b.t.tr2::after{left:auto;right:22%}.b.t.tr2::before{left:auto;right:14%}
.b.c{background:var(--caption);border-radius:0;text-align:left;font-weight:700;padding:.4em .6em;box-shadow:.25em .25em 0 rgba(0,0,0,.18)}
.b.loud{font-size:calc(var(--fs)*1.2);text-transform:uppercase;letter-spacing:.02em}
.b.x{background:none;border:0;padding:0;font:400 calc(var(--fs)*2.3)/1 var(--f-sfx);letter-spacing:.04em;color:var(--sfx,#ff6a3d);
  -webkit-text-stroke:max(1.5px,.3cqw) var(--ink);paint-order:stroke fill;transform:rotate(var(--r,-7deg));white-space:nowrap}
.b.x.big{font-size:calc(var(--fs)*3.4)}
.b.x.small{font-size:calc(var(--fs)*1.6)}
/* cover */
.cover .panel{border-width:max(3px,.7cqw)}
.cover-title{position:absolute;inset:3.5% 5% auto;text-align:center;z-index:2}
.cover-title h1{font:700 9.4cqw/0.98 var(--f-display);margin:0;color:#fff;letter-spacing:-.01em;text-wrap:balance;
  -webkit-text-stroke:.55cqw var(--ink);paint-order:stroke fill;text-shadow:0 .9cqw 0 var(--ink)}
.cover-title h1 span{color:var(--eye)}
.cover-title p{font:700 2.8cqw/1.3 var(--f-letter);color:var(--ink);background:var(--paper);display:inline-block;margin:2.6cqw 0 0;padding:.35em .9em;border:.35cqw solid var(--ink);border-radius:999px;text-wrap:balance}
.cover-foot{position:absolute;left:0;right:0;bottom:1.6%;text-align:center;font:700 2.6cqw var(--f-display);color:#fff;text-shadow:0 .25cqw 0 var(--ink);z-index:2}
/* photos */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw}
.photos figure{margin:0;background:#fff;padding:1.2cqw 1.2cqw 0;border:max(1.5px,.3cqw) solid var(--ink);box-shadow:.5cqw .5cqw 0 rgba(0,0,0,.15)}
.photos figure:nth-child(3n+1){transform:rotate(-1.4deg)}.photos figure:nth-child(3n){transform:rotate(1.2deg)}
.photos img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#ddd}
.photos figcaption{font:700 calc(var(--fs)*.9)/1.25 var(--f-letter);text-align:center;padding:.6em .2em .8em}
.intro{font:400 calc(var(--fs)*1.1)/1.45 var(--f-letter);margin:0 0 2.2cqw;max-width:62ch}
/* navigation */
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:12px;align-items:center;
  background:color-mix(in srgb,var(--desk) 88%,transparent);backdrop-filter:blur(6px);z-index:10}
.nav button{font:700 1rem var(--f-display);background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:.6em 1.3em;cursor:pointer;min-width:6.5em}
.nav button:disabled{opacity:.35;cursor:default}
.nav output{font:700 .95rem var(--f-display);min-width:7.5em;text-align:center;font-variant-numeric:tabular-nums}
button:focus-visible{outline:3px solid var(--eye);outline-offset:2px}
body.all .nav{display:none}
@media (prefers-reduced-motion: no-preference){.page.turn{animation:turn .35s ease-out}@keyframes turn{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>

  <pattern id="pTeal" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#93bdb8"/><path d="M1,4 q3,-3 5,0 M6,10 q3,-3 5,0" stroke="#b9d8d3" stroke-width="2" fill="none"/></pattern>
  <pattern id="pBrick" width="40" height="16" patternUnits="userSpaceOnUse"><rect width="40" height="16" fill="#dcc3ae"/><rect x="1" y="1" width="38" height="6.5" fill="#b56a4c"/><rect x="-19" y="9" width="38" height="6" fill="#a95f43"/><rect x="21" y="9" width="38" height="6" fill="#b56a4c"/></pattern>

  <pattern id="pPlank" width="26" height="200" patternUnits="userSpaceOnUse"><rect width="26" height="200" fill="#b89a79"/><rect width="2" height="200" fill="#8e7258"/><ellipse cx="13" cy="70" rx="2.5" ry="4" fill="#94775c"/></pattern>

<script>
/* ================= drawing kit ================= */
const F='#16151c',F2='#30303f',EYE='#b8dd4c',PATCH='#fbf8f1',SKIN='#f2c6a6',INK='#1d1b22';
const R=(x,y,w,h,f,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${ex}/>`;
const P=(d,f,ex='')=>`<path d="${d}" fill="${f}" ${ex}/>`;
const L=(d,c,w,ex='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;
const C=(x,y,r,f,ex='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${ex}/>`;
const E=(x,y,rx,ry,f,ex='')=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${ex}/>`;
const T=(x,y,s,t,f='#fff',ex='')=>`<text x="${x}" y="${y}" font-size="${s}" fill="${f}" font-family="Bangers, Impact, sans-serif" text-anchor="middle" stroke="${INK}" stroke-width="${s/14}" paint-order="stroke" letter-spacing="1" ${ex}>${t}</text>`;
const G=(x,y,s,b,r=0,flip=false)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${flip?-s:s} ${s})">${b}</g>`;

/* ---- Blacky ---- */
function catEyes(e){
  const eye=x=>E(x,-4,9.5,11,EYE)+E(x,-4,2.6,8.5,'#0a0a0d')+C(x+3.5,-9,2.6,'#fff');
  const wide=x=>E(x,-4,12,13.5,EYE)+C(x,-3,7,'#0a0a0d')+C(x+3.5,-8,3.4,'#fff')+C(x-3,1,1.5,'#fff');
  const arc=d=>L(d,'#a3a2bb',3.4);
  switch(e){
    case 'closed': return arc('M-26,-3 Q-17,4 -8,-3')+arc('M8,-3 Q17,4 26,-3');
    case 'happy': return arc('M-26,1 Q-17,-10 -8,1')+arc('M8,1 Q17,-10 26,1');
    case 'wide': return wide(-17)+wide(17);
    case 'sad': return wide(-17)+wide(17)+arc('M-30,-19 L-10,-25')+arc('M30,-19 L10,-25');
    case 'half': return eye(-17)+eye(17)+P('M-30,-18 H-5 V-4 Q-17,-1 -30,-4Z M5,-18 H30 V-4 Q17,-1 5,-4Z',F)+arc('M-28,-4 Q-17,-1 -6,-4')+arc('M6,-4 Q17,-1 28,-4');
    default: return eye(-17)+eye(17);
  }
}
function catHead(o={}){
  const flat=o.ears==='flat';
  let s = flat
    ? P('M-44,-6 L-68,-40 L-18,-36Z',F)+P('M44,-6 L68,-40 L18,-36Z',F)+P('M-40,-12 L-58,-35 L-24,-33Z','#c98a96')+P('M40,-12 L58,-35 L24,-33Z','#c98a96')
    : P('M-42,-14 L-38,-70 L-8,-40Z',F)+P('M42,-14 L38,-70 L8,-40Z',F)+P('M-35,-24 L-33,-58 L-15,-40Z','#c98a96')+P('M35,-24 L33,-58 L15,-40Z','#c98a96');
  s+=P('M-46,4 C-48,-32 -26,-46 0,-46 C26,-46 48,-32 46,4 C44,30 22,40 0,40 C-22,40 -44,30 -46,4Z',F);
  s+=L('M-34,-26 Q-20,-40 0,-41',F2,4);
  s+=catEyes(o.eyes||'open');
  if(o.blush) s+=E(-30,13,8,4.5,'#e58a9a','opacity=".5"')+E(30,13,8,4.5,'#e58a9a','opacity=".5"');
  const m=o.mouth||'smile';
  if(m==='open') s+=E(0,22,6.5,8,'#5a2533')+E(0,26,4.5,3.2,'#e58a9a');
  else if(m==='yawn') s+=E(0,24,12,14,'#5a2533')+E(0,31,8,5,'#e58a9a')+P('M-8,12 L-5,19 L-2,12Z','#fff')+P('M8,12 L5,19 L2,12Z','#fff');
  else if(m==='flat') s+=L('M-7,19 H7','#8e8ca6',2.4);
  else if(m==='frown') s+=L('M-9,23 Q0,15 9,23','#8e8ca6',2.4);
  else s+=L('M0,14 Q-5,21 -11,17 M0,14 Q5,21 11,17','#8e8ca6',2.4);
  s+=P('M-5,8 L5,8 L0,14Z','#6e4f5c');
  s+=L('M-16,12 L-60,4 M-16,16 L-60,18 M-16,20 L-56,30 M16,12 L60,4 M16,16 L60,18 M16,20 L56,30','#c4c2d6',1.6,'opacity=".9"');
  if(o.tear) s+=P('M-26,10 Q-31,21 -26,25 Q-21,21 -26,10Z','#7cc4f2');
  return s;
}
const patch=(x,y,s)=>G(x,y,s,P('M-12,-10 C-6,-3 6,-3 12,-10 C10,2 5,10 0,14 C-5,10 -10,2 -12,-10Z',PATCH));
const shadow=(x,y,rx)=>E(x,y,rx,rx*.12,'#000','opacity=".14"');
function cat(pose='sit',o={}){
  const H=catHead(o); const leg=(d)=>L(d,F,13);
  switch(pose){
  case 'sit': return shadow(0,2,62)+
    (o.tailDown?L('M30,-8 C64,-2 90,0 108,2',F,15):L('M30,-8 C78,-6 92,-44 70,-82',F,15))+
    P('M-46,0 C-58,-50 -38,-98 0,-100 C38,-98 58,-50 46,0Z',F)+L('M-38,-22 C-46,-52 -32,-74 -16,-78',F2,4)+L('M0,-56 L0,-8',F2,3)+
    E(-17,-4,15,7.5,F,`stroke="${F2}" stroke-width="2"`)+E(17,-4,15,7.5,F,`stroke="${F2}" stroke-width="2"`)+
    patch(0,-80,1.1)+G(0,-122,1,H);
  case 'walk': {
    const run=o.run;
    return shadow(0,2,70)+
    (o.tailDown?L('M-52,-50 C-80,-40 -95,-20 -102,-8',F,13):L('M-52,-58 C-88,-62 -98,-104 -80,-126',F,13))+
    (run? leg('M-36,-48 L-84,-30')+leg('M-26,-44 L-62,-12')+leg('M30,-50 L80,-40')+leg('M40,-46 L90,-60')
        : leg('M-38,-44 L-46,-4')+leg('M-22,-44 L-16,-4')+leg('M26,-44 L20,-4')+leg('M40,-44 L48,-4'))+
    E(-2,-54,58,26,F)+L('M-40,-72 Q0,-84 36,-74',F2,4)+patch(44,-60,.7)+G(56,-90,.78,H);
  }
  case 'loaf': return shadow(0,2,74)+L('M52,-12 C86,-10 98,-26 86,-44',F,12)+E(0,-32,68,32,F)+L('M-50,-46 Q-30,-62 0,-64',F2,4)+
    E(-17,-4,14,7,F,`stroke="${F2}" stroke-width="2"`)+E(17,-4,14,7,F,`stroke="${F2}" stroke-width="2"`)+patch(0,-50,.85)+G(0,-80,.9,H);
  case 'curl': return shadow(0,2,72)+E(0,-34,68,34,F)+L('M-10,-64 Q34,-70 58,-44',F2,5)+
    (o.toy?G(-62,-6,.75,muis()):'')+L('M62,-18 C46,8 -36,10 -60,-6',F,13)+G(-30,-44,.72,catHead({eyes:'closed',...o}),-14);
  case 'stretch': return shadow(0,2,140)+L('M-86,-24 C-118,-32 -134,-18 -156,-28',F,11)+
    L('M-66,-16 L-128,-8',F,12)+L('M-58,-10 L-118,2',F,12)+L('M66,-18 L134,-14',F,12)+L('M58,-10 L128,0',F,12)+
    E(0,-24,92,22,F)+L('M-60,-40 Q0,-50 60,-42',F2,4)+G(96,-38,.62,H,8);
  case 'belly': return shadow(0,2,90)+L('M66,-22 C92,-18 104,-4 122,-10',F,12)+
    L('M-44,-40 L-58,-86',F,12)+L('M-24,-44 L-26,-90',F,12)+L('M30,-44 L40,-88',F,12)+L('M48,-40 L72,-74',F,12)+
    E(0,-28,68,26,F)+patch(32,-36,1.1)+patch(-18,-28,.55)+G(-84,-30,.66,H,-80);
  }
}
/* Mr. Muis, the soft toy mouse */
const muis=()=>L('M30,0 C50,4 58,-10 72,-4','#9c958c',5)+E(0,-14,34,18,'#b5ada3')+C(-30,-22,16,'#b5ada3')+C(-36,-38,9,'#a39b91')+C(-22,-38,9,'#a39b91')+
  C(-36,-38,5,'#d9b8bc')+C(-22,-38,5,'#d9b8bc')+C(-36,-23,2.2,'#2b2b2b')+C(-26,-23,2.2,'#2b2b2b')+C(-46,-18,3,'#7a6d6d')+E(14,-6,8,5,'#a39b91');
const fishToy=()=>P('M-34,0 C-20,-20 20,-20 30,0 C20,20 -20,20 -34,0Z','#f39a3d')+P('M28,0 L50,-16 L50,16Z','#f39a3d')+C(-18,-4,3.5,INK)+L('M-4,-10 Q4,0 -4,10 M8,-10 Q16,0 8,10','#d1782a',3);

/* ---- the humans: Beardy and Huggy ---- */
function human(type,o={}){
  const B=type==='beardy';
  const shirt=B?'#4e9c86':'#e7a6bb', pants='#3e5f92', shoe=B?'#3b3b45':'#f4cfda', hair=B?'#4a3426':'#5b3b29';
  const arm=(d,hx,hy)=>L(d,shirt,17)+C(hx,hy,10,SKIN);
  const up=o.sit?70:0;
  let s='';
  // legs
  if(o.sit) s+=L('M-18,-46 C-30,-40 -36,-34 -34,-8',pants,24)+L('M18,-46 C30,-40 36,-34 34,-8',pants,24)+E(-38,-6,18,8,shoe)+E(38,-6,18,8,shoe);
  else s+=L('M-18,-120 L-24,-10 M18,-120 L24,-10',pants,24)+E(-28,-6,18,8,shoe)+E(28,-6,18,8,shoe);
  let b='';
  if(!B) b+=P('M-36,-262 C-44,-306 44,-306 36,-262 C44,-232 44,-200 36,-186 L-36,-186 C-44,-200 -44,-232 -36,-262Z',hair);
  b+=P('M-42,-206 C-50,-170 -44,-130 -38,-110 L38,-110 C44,-130 50,-170 42,-206 C30,-220 -30,-220 -42,-206Z',shirt);
  if(B) b+=L('M-14,-213 L0,-198 L14,-213','#3f8370',5);
  if(o.holding) b+=o.holding;
  const a=o.arms||'down';
  const dl=arm('M-40,-198 C-56,-170 -58,-142 -54,-122',-54,-118), dr=arm('M40,-198 C56,-170 58,-142 54,-122',54,-118);
  if(a==='down') b+=dl+dr;
  else if(a==='wave') b+=dl+arm('M40,-198 C62,-212 70,-240 66,-262',66,-266);
  else if(a==='point') b+=dl+arm('M40,-196 C66,-196 86,-200 100,-206',104,-208);
  else if(a==='pointL') b+=arm('M-40,-196 C-66,-196 -86,-200 -100,-206',-104,-208)+dr;
  else if(a==='cheer') b+=arm('M-40,-198 C-62,-214 -70,-244 -66,-270',-66,-274)+arm('M40,-198 C62,-214 70,-244 66,-270',66,-274);
  else if(a==='hug') b+=arm('M-40,-198 C-48,-160 -10,-140 30,-150',34,-150)+arm('M40,-198 C64,-186 72,-160 58,-142',54,-138);
  else if(a==='pet') b+=dl+arm('M40,-196 C66,-180 52,-166 26,-168',22,-168);
  else if(a==='hold') b+=arm('M-40,-196 C-50,-170 -40,-156 -24,-156',-22,-156)+arm('M40,-196 C50,-170 40,-156 24,-156',22,-156);
  else if(a==='open') b+=arm('M-40,-198 C-70,-196 -92,-188 -106,-176',-110,-174)+arm('M40,-198 C70,-196 92,-188 106,-176',110,-174);
  if(o.front) b+=o.front;
  b+=R(-9,-228,18,18,SKIN)+C(-32,-254,6,SKIN)+C(32,-254,6,SKIN)+C(0,-256,32,SKIN);
  const ex=o.face||'smile';
  if(ex==='closed'||ex==='laugh') b+=L('M-19,-256 Q-13,-262 -7,-256 M7,-256 Q13,-262 19,-256',INK,2.6);
  else b+=C(-13,-258,3.3,INK)+C(13,-258,3.3,INK);
  if(ex==='sad') b+=L('M-21,-270 L-7,-273 M21,-270 L7,-273',INK,2.4);
  if(!B) b+=E(-21,-244,6,3.5,'#ef9aa8','opacity=".55"')+E(21,-244,6,3.5,'#ef9aa8','opacity=".55"');
  b+= B ? `<g fill="none" stroke="#1c1c22" stroke-width="3.5"><rect x="-26" y="-266" width="21" height="15" rx="3"/><rect x="5" y="-266" width="21" height="15" rx="3"/><path d="M-5,-260 h10 M-26,-260 h-6 M26,-260 h6"/></g>`
        : `<g fill="none" stroke="#a32b3e" stroke-width="3"><ellipse cx="-14" cy="-258" rx="11" ry="8.5"/><ellipse cx="14" cy="-258" rx="11" ry="8.5"/><path d="M-3,-259 h6"/></g>`;
  if(B){
    b+=P('M-33,-258 C-38,-296 30,-300 34,-262 C28,-280 4,-288 -16,-280 C-24,-276 -30,-268 -33,-258Z',hair);
    b+=P('M-30,-252 C-32,-214 32,-214 30,-252 C26,-234 16,-230 0,-230 C-16,-230 -26,-234 -30,-252Z','#b58e69');
    b+=P('M-13,-243 Q0,-250 13,-243 Q0,-239 -13,-243Z','#9c774f');
  } else b+=P('M-33,-258 C-36,-292 34,-296 34,-262 C20,-282 -14,-284 -33,-258Z',hair);
  const my=B?-235:-241;
  if(ex==='open'||ex==='laugh') b+=E(0,my+1,7,6,'#7a2e3a');
  else if(ex==='sad') b+=L(`M-8,${my+3} Q0,${my-3} 8,${my+3}`,INK,2.6);
  else if(ex==='surprised') b+=E(0,my,4,5,'#7a2e3a');
  else b+=L(`M-9,${my-1} Q0,${my+6} 9,${my-1}`,INK,2.6);
  s+=up?G(0,up,1,b):b;
  return s;
}

/* ================= render ================= */
const book=document.getElementById('book');
function panelHTML(p){
  const bub=p.b.map(([x,y,w,t,k='c',tail='none'])=>{
    const cls=k.split(' ').concat(k.startsWith('x')?[]:tail.split(' '));
    return `<div class="b ${cls.join(' ')}" style="left:${x}%;top:${y}%;width:${w}%">${t}</div>`;}).join('');
  return `<figure class="panel${p.span===2?' span2':''}" style="aspect-ratio:${p.w}/${p.h}"><svg viewBox="0 0 ${p.w} ${p.h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${p.art(p.w,p.h)}</svg>${bub}</figure>`;
}
let html=`<article class="page cover" id="p0" aria-label="Cover"><figure class="panel" style="aspect-ratio:800/1040"><svg viewBox="0 0 800 1040" aria-hidden="true">
  ${R(0,0,800,1040,'url(#gDawn)')}${C(650,420,80,'#ffe7a0','opacity=".9"')}${houses(-20,780,4,210,260,{})}${R(0,780,800,260,'url(#pTiles)')}${R(0,780,800,6,'#a8a093')}
  ${R(230,895,340,62,'#a87f55','rx="8"')}<text x="400" y="938" font-size="38" text-anchor="middle" fill="#7a5638" font-family="Bangers, Impact" letter-spacing="6">WELKOM</text>
  ${clock(120,640,62,7,30,{label:'7:30'})}${G(420,925,2.05,cat('sit',{eyes:'open',blush:1}))}${heart(600,610,2.4)}${G(610,980,.8,muis())}
  </svg><div class="cover-title"><h1>Blacky's <span>Secret</span> Second Home</h1><p>Every morning at 7:30, a little black cat knocks on our door.</p></div>
  <div class="cover-foot">A comic book based on a true story</div></figure></article>`;
pages.forEach((pg,i)=>{
  html+=`<article class="page" id="p${i+1}" aria-label="Page ${i+1}"><h3 class="ptitle">${pg.title}</h3><div class="grid">${pg.panels.map(panelHTML).join('')}</div><div class="folio"><span>Blacky's Secret Second Home</span><span>${i+1}</span></div></article>`;
});
const photos=[['statue','The real Blacky, posing like a statue'],['nap','Nap time with his soft toy'],['football','Football night with chin scratches'],

/* ================= reading modes ================= */
const all=[...book.querySelectorAll('.page')], pos=document.getElementById('pos'), prev=document.getElementById('prev'), next=document.getElementById('next');
const bBook=document.getElementById('modeBook'), bAll=document.getElementById('modeAll');
let cur=0, mode='book';
function show(i,anim=true){
  cur=Math.max(0,Math.min(all.length-1,i));
  all.forEach((p,k)=>{p.hidden=mode==='book'&&k!==cur;});
  if(anim&&mode==='book'){all[cur].classList.remove('turn');void all[cur].offsetWidth;all[cur].classList.add('turn');}
  pos.textContent=cur===0?'Cover':`Page ${cur} of ${all.length-1}`;
  prev.disabled=cur===0; next.disabled=cur===all.length-1;
}
function setMode(m){
  mode=m; document.body.classList.toggle('all',m==='all');
  bBook.setAttribute('aria-pressed',m==='book'); bAll.setAttribute('aria-pressed',m==='all');
  try{localStorage.setItem('blacky-mode',m);}catch(e){}
  show(cur,false);
}
prev.onclick=()=>{show(cur-1);window.scrollTo({top:0});};
next.onclick=()=>{show(cur+1);window.scrollTo({top:0});};
bBook.onclick=()=>setMode('book'); bAll.onclick=()=>setMode('all');
document.addEventListener('keydown',e=>{if(mode!=='book')return;if(e.key==='ArrowRight'){next.click();}if(e.key==='ArrowLeft'){prev.click();}});
let tx=null;
book.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
book.addEventListener('touchend',e=>{if(tx===null||mode!=='book')return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)(dx<0?next:prev).click();tx=null;});
const hm=/^#p(\d+)$/.exec(location.hash||''); if(hm) cur=+hm[1];
let saved='book'; try{saved=localStorage.getItem('blacky-mode')||'book';}catch(e){}
setMode(saved==='all'?'all':'book');
</script>
